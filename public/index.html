<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#24508F">
  <title>Dompet Harian</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Dompet">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <!-- Login -->
  <main id="login" class="login" hidden>
    <form id="loginForm" class="login-card" autocomplete="on">
      <div class="brand brand-lg"><span class="brand-mark" aria-hidden="true"></span>Dompet Harian</div>
      <p class="login-sub">Catat pemasukan, pengeluaran, dan tabungan setiap hari.</p>
      <label>Username<input name="username" autocomplete="username" required autocapitalize="none"></label>
      <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
      <p class="form-error" id="loginError" role="alert"></p>
      <button class="btn btn-primary btn-block" type="submit">Masuk</button>
    </form>
  </main>

  <!-- App -->
  <div id="app" class="shell" hidden>
    <aside class="sidebar" id="sidebar">
      <div class="brand"><span class="brand-mark" aria-hidden="true"></span>Dompet Harian</div>
      <nav class="nav" id="nav"></nav>
      <div class="sidebar-foot">
        <div class="who" id="who"></div>
        <button class="btn btn-primary btn-block" id="installBtn" type="button" hidden>Pasang aplikasi</button>
        <button class="btn btn-ghost btn-block" id="logoutBtn" type="button">Keluar</button>
      </div>
    </aside>
    <div class="scrim" id="scrim"></div>

    <div class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menuBtn" type="button" aria-label="Buka menu">
          <svg viewBox="0 0 24 24" width="22" height="22"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
        <h1 id="pageTitle">Dashboard</h1>
        <div class="topbar-right">
          <div class="bell-wrap">
            <button class="icon-btn" id="bellBtn" type="button" aria-label="Notifikasi" aria-expanded="false">
              <svg viewBox="0 0 24 24" width="22" height="22"><path d="M6 16V11a6 6 0 1 1 12 0v5l1.5 2h-15L6 16zM10 20a2 2 0 0 0 4 0" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
              <span class="badge" id="bellBadge" hidden>0</span>
            </button>
            <div class="notif-panel" id="notifPanel" hidden>
              <div class="notif-head"><b>Notifikasi</b><button class="link-btn" id="readAllBtn" type="button">Tandai semua dibaca</button></div>
              <div class="notif-list" id="notifList"></div>
            </div>
          </div>
        </div>
      </header>
      <div class="viewing" id="viewingBar" hidden></div>
      <section class="content" id="content" tabindex="-1"></section>
    </div>
    <button class="fab" id="fab" type="button" aria-label="Tambah transaksi">
      <svg viewBox="0 0 24 24" width="26" height="26"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
    </button>
  </div>

  <dialog id="modal" class="modal"><form method="dialog" id="modalForm" novalidate></form></dialog>
  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
